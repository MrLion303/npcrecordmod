name: Compilar mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Forge 1.20.1
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compilar
        run: gradle build --no-daemon

      - name: Guardar JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: npcrecordmod-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
